name: Temporary worker bundle rebuild
on:
  push:
    branches:
      - fix/h3-spacing-legacy-css-parity-20261117
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild committed browser bundles
        run: node tools/build-worker-bundle.js
      - name: Commit regenerated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add red-build/ui/engine-worker.bundle.js red-build/ui/app.bundle.js
          if git diff --cached --quiet; then
            echo "Browser bundles already match the source."
            exit 0
          fi
          git commit -m "build(worker): regenerate bundles with H3 cache version"
          git push origin "HEAD:${GITHUB_REF_NAME}"
